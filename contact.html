<body class="contact-page">
    <header class="site-header"><div class="page-header wrapper">
        <div class="header-brand"><h1><a class="home-link" href="profile.html">PROFILE</a></h1></div>
        <nav class="header-nav" aria-label="メインナビゲーション"><ul class="main-nav font-english">

    <main class="contact-shell contact-shell--single">
        <section class="contact-panel contact-panel--single" aria-label="連絡先メッセージ">
            <div class="chat-window chat-window--single">
                <div class="contact-topbar">
                    <span class="contact-topbar__label">takuma</span>
                    <a href="mailto:example@example.com" class="contact-topbar__mail">Mail</a>
                </div>
                <form class="composer composer--minimal" action="mailto:example@example.com" method="post" enctype="text/plain">
                    <label class="sr-only" for="dm-message">メッセージ</label>
                    <textarea id="dm-message" name="message" rows="1" placeholder="メッセージを入力"></textarea>
                    <button type="submit">Send</button>
                </form>
            </div>
        </section>
    </main>
