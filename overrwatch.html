        <main>
            <section>
                <nav class="owtitle">
                <h2>Overwatchとは</h2>
                </nav>
                <p>Overwatchは、Blizzard Entertainmentが開発したチームベースのマルチプレイヤーFPSゲームです。プレイヤーは、さまざまな能力を持つヒーローキャラクターを選択し、チームで協力して目標を達成することを目的としています。</p>
            </section>
            <section>
                <h2>ゲームの特徴</h2>
                <ul>
                    <li>多様なヒーローキャラクター</li>
                    <li>戦略的なチームプレイ</li>
                    <li>美しいグラフィックとアニメーション</li>
                    <li>定期的なアップデートとイベント</li>
                </ul>
            </section>
            <section>
                <h2>私の好きなヒーロー</h2>
                <p>私の好きなヒーローは「トレーサー」です。彼女のスピードと機動力は非常に魅力的で、戦場での立ち回りが楽しいです。</p>
